---
name: "Kubeconform"

on:
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  kubeconform:
    name: Kubeconform
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup kubeconform
        uses: fluxcd/flux2/action@889be9d6cc8afa8ed639e1e1ba4ab678e3b38d8c # v2.9.4
        with:
          version: "latest"

      - name: Install kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | \
            tar xz -C /usr/local/bin kubeconform

      - name: Validate manifests
        run: |
          # kubeconform validates the raw manifests before Flux's postBuild
          # variable substitution runs, so template placeholders need to be
          # swapped for a dummy value that satisfies the target schema
          # (e.g. a valid-looking hostname) purely for validation purposes.
          cp -r kubernetes /tmp/kubeconform-kubernetes
          grep -rl '${SECRET_DOMAIN}' /tmp/kubeconform-kubernetes | \
            xargs -r sed -i 's/${SECRET_DOMAIN}/example.com/g'

          find /tmp/kubeconform-kubernetes -name '*.yaml' -not -name '*.sops.yaml' -not -name 'kustomization.yaml' | \
            xargs -I {} kubeconform \
              -strict \
              -ignore-missing-schemas \
              -schema-location default \
              -schema-location "https://kubernetes-schemas.pages.dev/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json" \
              -output text \
              {}
